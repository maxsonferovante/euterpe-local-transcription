<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Euterpe local media validation and transcription architecture</title>
  <desc id="desc">The coding agent declares mp3 or mp4. The MCP tool passes the request to an application use case, which resolves the allowed file and asks ffprobe for media metadata. Matching extension, container and audio metadata are required before a job is stored and scheduled. A mismatch aborts with details. Valid media is transcribed locally and saved as transcript JSON.</desc>
  <style>
    :root { color-scheme: light dark; --bg:#f8fafc; --panel:#fff; --ink:#162033; --muted:#53627a; --line:#66758b; --blue:#dbeafe; --blue-stroke:#2563eb; --violet:#ede9fe; --violet-stroke:#7c3aed; --green:#dcfce7; --green-stroke:#16a34a; --amber:#fef3c7; --amber-stroke:#d97706; --rose:#ffe4e6; --rose-stroke:#e11d48; --shadow:#0f172a12; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111827; --panel:#182235; --ink:#edf2ff; --muted:#a9b6cc; --line:#94a3b8; --blue:#172c4b; --blue-stroke:#60a5fa; --violet:#30234b; --violet-stroke:#c4b5fd; --green:#153523; --green-stroke:#4ade80; --amber:#3b2d13; --amber-stroke:#fbbf24; --rose:#3f1e2a; --rose-stroke:#fb7185; --shadow:#0005; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:var(--ink); }
    .title { font-size:25px; font-weight:700; letter-spacing:-.3px; }
    .subtitle { font-size:13px; fill:var(--muted); }
    .box { fill:var(--panel); stroke:#94a3b8; stroke-width:1.5; rx:13; filter:url(#shadow); }
    .agent { fill:var(--blue); stroke:var(--blue-stroke); }
    .mcp { fill:var(--violet); stroke:var(--violet-stroke); }
    .core { fill:var(--amber); stroke:var(--amber-stroke); }
    .valid { fill:var(--green); stroke:var(--green-stroke); }
    .reject { fill:var(--rose); stroke:var(--rose-stroke); }
    .label { font-size:15px; font-weight:650; text-anchor:middle; }
    .detail { font-size:11px; fill:var(--muted); text-anchor:middle; }
    .edge { fill:none; stroke:var(--line); stroke-width:2; marker-end:url(#arrow); }
    .edge-ok { stroke:var(--green-stroke); marker-end:url(#arrow-green); }
    .edge-bad { stroke:var(--rose-stroke); marker-end:url(#arrow-rose); }
    .edge-dashed { stroke-dasharray:6 5; }
    .tag { font-size:10px; font-weight:700; fill:var(--muted); letter-spacing:.5px; }
    .footer { font-size:10px; fill:var(--muted); }
  </style>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--shadow)"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--green-stroke)"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--rose-stroke)"/></marker>
  </defs>
  <rect width="1200" height="690" rx="18" fill="var(--bg)"/>
  <text x="42" y="48" class="title">Euterpe · validação e transcrição local</text>
  <text x="42" y="72" class="subtitle">O formato declarado precisa corresponder ao arquivo antes de qualquer operação ser criada.</text>

  <text x="42" y="120" class="tag">ENTRADA E VALIDAÇÃO</text>
  <rect x="42" y="140" width="170" height="78" class="box agent"/>
  <text x="127" y="173" class="label">Agente de codificação</text><text x="127" y="195" class="detail">path + expected_format</text>
  <rect x="285" y="140" width="165" height="78" class="box mcp"/>
  <text x="367" y="173" class="label">Ferramenta MCP</text><text x="367" y="195" class="detail">transcribe_mp3</text>
  <rect x="530" y="140" width="225" height="78" class="box core"/>
  <text x="642" y="173" class="label">Caso de uso</text><text x="642" y="195" class="detail">valida formato + metadados</text>
  <path d="M212 179H279" class="edge"/><text x="246" y="164" class="detail">pedido MCP</text>
  <path d="M450 179H524" class="edge"/><text x="487" y="164" class="detail">inicia validação</text>

  <rect x="835" y="112" width="320" height="136" class="box reject"/>
  <text x="995" y="144" class="label">Divergência → aborta</text>
  <text x="995" y="168" class="detail">Retorna formato esperado e detectado,</text>
  <text x="995" y="186" class="detail">extensão, container, codec e streams.</text>
  <text x="995" y="218" class="detail">Nenhuma operação é criada ou agendada.</text>
  <path d="M755 158H829" class="edge edge-bad"/><text x="792" y="143" class="detail">não confere</text>

  <text x="42" y="290" class="tag">INSPEÇÃO LOCAL</text>
  <rect x="285" y="310" width="205" height="78" class="box"/>
  <text x="387" y="343" class="label">Acesso a arquivos</text><text x="387" y="365" class="detail">resolve caminho permitido</text>
  <rect x="545" y="310" width="205" height="78" class="box mcp"/>
  <text x="647" y="343" class="label">Adaptador de mídia</text><text x="647" y="365" class="detail">ffprobe lê metadados</text>
  <text x="42" y="336" class="detail" text-anchor="start">extensão</text><text x="42" y="355" class="detail" text-anchor="start">container</text><text x="42" y="374" class="detail" text-anchor="start">stream de áudio</text>
  <path d="M530 198H500V349H496" class="edge"/>
  <path d="M755 198H780V349H756" class="edge"/>
  <path d="M490 349H539" class="edge"/><text x="514" y="334" class="detail">arquivo</text>
  <rect x="835" y="310" width="320" height="78" class="box valid"/>
  <text x="995" y="343" class="label">Formato válido</text><text x="995" y="365" class="detail">MP4 contém áudio · MP3 usa codec MP3</text>
  <path d="M750 349H829" class="edge edge-ok"/><text x="790" y="334" class="detail">confere</text>

  <text x="42" y="453" class="tag">SOMENTE APÓS A VALIDAÇÃO</text>
  <rect x="285" y="474" width="205" height="78" class="box"/>
  <text x="387" y="507" class="label">Operações locais</text><text x="387" y="529" class="detail">SQLite · cria job</text>
  <rect x="545" y="474" width="205" height="78" class="box mcp"/>
  <text x="647" y="507" class="label">Worker assíncrono</text><text x="647" y="529" class="detail">executa operação válida</text>
  <rect x="835" y="474" width="150" height="78" class="box core"/>
  <text x="910" y="507" class="label">FFmpeg +</text><text x="910" y="529" class="detail">Whisper local</text>
  <rect x="1035" y="474" width="160" height="78" class="box valid"/>
  <text x="1115" y="507" class="label">Transcrição JSON</text><text x="1115" y="529" class="detail">artefato local</text>
  <path d="M995 388V430H387V468" class="edge edge-ok"/><text x="666" y="424" class="detail">cria operação após validar</text>
  <path d="M490 513H539" class="edge edge-dashed"/><text x="514" y="498" class="detail">agenda</text>
  <path d="M750 513H829" class="edge"/><text x="790" y="498" class="detail">transcreve</text>
  <path d="M985 513H1029" class="edge"/><text x="1007" y="498" class="detail">salva</text>

  <text x="42" y="625" class="footer">MP3 e MP4 são validados antes do agendamento. O processamento de áudio permanece na máquina local.</text>
  <text x="42" y="646" class="footer">Referências no código: adapters/mcp.rs · application.rs · adapters.rs</text>
</svg>
